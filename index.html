<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: {
              primary: '#C5A059',
              'primary-dark': '#5C4B25',
              secondary: '#8B2635',
              tertiary: '#8FA5D8',
              neutral: '#2D2926',
              'neutral-light': '#F5EFE6',
              bg: '#FDFBF7',
              border: '#E8DFD3',
            }
          },
          fontFamily: {
            serif: ['"Libre Caslon Text"', 'Cinzel', 'Playfair Display', 'serif'],
            sans: ['"Source Sans 3"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Source Sans 3', 'Inter', sans-serif;
      background-color: #FDFBF7;
      color: #2D2926;
    }

    .font-serif {
      font-family: 'Libre Caslon Text', 'Playfair Display', serif;
    }

    .fade-enter-active,
    .fade-leave-active {
      transition: all 0.3s ease;
    }

    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
      transform: scale(0.98);
    }
  </style>
  <title>My Devotion App</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
